name: Build and publish desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows-x64
            artifact: MyAI-windows-x64.exe
          - runner: ubuntu-24.04
            platform: linux-x64
            artifact: MyAI-linux-x64.flatpak
          - runner: macos-15
            platform: macos-arm64
            artifact: MyAI-macos-arm64.dmg
          - runner: macos-15-intel
            platform: macos-x64
            artifact: MyAI-macos-x64.dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install CPU-only PyTorch
        if: runner.os != 'macOS'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install PyTorch for macOS
        if: runner.os == 'macOS'
        run: python -m pip install torch
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build application
        run: python -m PyInstaller --clean --noconfirm --distpath dist --workpath build MyAI.spec
      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets | Out-Null
          Copy-Item dist/MyAI.exe "release-assets/${{ matrix.artifact }}"
      - name: Install Flatpak build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Build Linux Flatpak
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-assets
          flatpak-builder --user --force-clean --install-deps-from=flathub --repo=flatpak-repo flatpak-build packaging/flatpak/com.kobmac48bot.MyAI.json
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo flatpak-repo "release-assets/${{ matrix.artifact }}" com.kobmac48bot.MyAI
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          mkdir -p release-assets dmg-stage
          cp release/README.txt dmg-stage/README.txt
          cp LICENSE dmg-stage/LICENSE.txt
          cp -R dist/MyAI.app dmg-stage/MyAI.app
          cd dist
          hdiutil create -volname MyAI -srcfolder ../dmg-stage -ov -format UDZO "../release-assets/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: release-assets/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1

  build-windows-x86:
    name: Build windows-x86 legacy client
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
          architecture: x86
      - name: Install legacy client build dependencies
        run: python -m pip install "pyinstaller==4.10" certifi
      - name: Build Windows 7/8 client
        env:
          MYAI_LEGACY_CLIENT: "1"
        run: python -m PyInstaller --clean --noconfirm --distpath dist --workpath build-legacy MyAI.spec
      - name: Package legacy client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets | Out-Null
          Copy-Item dist/MyAI-windows-x86.exe release-assets/MyAI-windows-x86.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86
          path: release-assets/MyAI-windows-x86.exe
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs:
      - build
      - build-windows-x86
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
