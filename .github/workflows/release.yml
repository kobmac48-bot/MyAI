name: Build and publish desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows-x64
            archive: MyAI-windows-x64.zip
          - runner: ubuntu-24.04
            platform: linux-x64
            archive: MyAI-linux-x64.tar.gz
          - runner: macos-15
            platform: macos-arm64
            archive: MyAI-macos-arm64.zip
          - runner: macos-15-intel
            platform: macos-x64
            archive: MyAI-macos-x64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install CPU-only PyTorch
        if: runner.os != 'macOS'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install PyTorch for macOS
        if: runner.os == 'macOS'
        run: python -m pip install torch
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build application
        run: python -m PyInstaller --clean --noconfirm --distpath dist --workpath build MyAI.spec
      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets | Out-Null
          Copy-Item release/README.txt dist/README.txt
          Copy-Item LICENSE dist/LICENSE.txt
          Compress-Archive -Path dist/MyAI, dist/README.txt, dist/LICENSE.txt -DestinationPath "release-assets/${{ matrix.archive }}"
      - name: Package Linux app
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-assets
          cp release/README.txt dist/README.txt
          cp LICENSE dist/LICENSE.txt
          tar -C dist -czf "release-assets/${{ matrix.archive }}" MyAI README.txt LICENSE.txt
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          mkdir -p release-assets
          cp release/README.txt dist/README.txt
          cp LICENSE dist/LICENSE.txt
          cp dist/README.txt dist/LICENSE.txt dist/MyAI.app/Contents/Resources/
          cd dist
          ditto -c -k --sequesterRsrc --keepParent MyAI.app "../release-assets/${{ matrix.archive }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: release-assets/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
